name: Prepare release

on:
  workflow_dispatch:
    inputs:
      selection:
        description: Which plugin release to prepare
        required: true
        type: choice
        options:
          - ship-info
          - navy-staff
          - both
        default: ship-info

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      RELEASE_APP_ID: ${{ secrets.RELEASE_APP_ID }}
    steps:
      - name: Require the GitHub App credentials
        if: env.RELEASE_APP_ID == ''
        run: |
          echo "::error::Prepare release requires a GitHub App so the generated Release PR triggers CI. Add repository secrets RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY as described in docs/releases.md."
          exit 1
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare Release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: >
          node scripts/release/prepare.mjs
          --selection "${{ inputs.selection }}"
          --base-branch "${{ github.event.repository.default_branch }}"
